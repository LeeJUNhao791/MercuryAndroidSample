plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ffalcon.mercury.android.sdk.demo'
    compileSdk 35
    ndkVersion '21.1.6352462'

    defaultConfig {
        applicationId "com.ffalcon.mercury.android.sdk"
        minSdk 29
        targetSdk 31
        versionCode 1
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    buildTypes {

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding = true
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    configurations {
        extractForNativeBuild
    }

    defaultConfig {
        applicationId "com.ffalcon.mercury.android.sdk"
        minSdk 29
        targetSdk 31
        versionCode 1
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                targets  'wenet'
                cppFlags '-std=c++14', '-DC10_USE_GLOG', '-DC10_USE_MINIMAL_GLOG', '-DANDROID', '-Wno-c++11-narrowing', '-fexceptions'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            version '3.18.1'
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation(fileTree("libs"))
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.fragment:fragment-ktx:1.5.3'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.tencent.tav:libpag:4.3.62'

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'com.google.mlkit:vision-interfaces:16.3.0'
    implementation 'com.github.jenly1314:camera-scan:1.4.1'
    implementation 'com.github.jenly1314:viewfinderview:1.4.0'

    implementation 'org.pytorch:pytorch_android:1.13.0'
    extractForNativeBuild 'org.pytorch:pytorch_android:1.13.0'
    implementation 'com.github.pengzhendong:wenet-openfst-android:1.0.2'
    extractForNativeBuild 'com.github.pengzhendong:wenet-openfst-android:1.0.2'

    // 本地单元测试依赖（运行在 JVM 上）
    testImplementation 'junit:junit:4.13.2'

    // Android 仪器化测试依赖（运行在设备或模拟器上）
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    }

    task extractAARForNativeBuild {
        doLast {
            configurations.extractForNativeBuild.files.each {
                def file = it.absoluteFile
                def filename = file.name
                // 移除 .aar 扩展名作为目录名
                def extractDir = "$buildDir/${filename.replace('.aar', '')}"
                copy {
                    from zipTree(file)
                    into extractDir
                    include 'headers/**'
                    include 'jni/**'
                }
                println "Extracted $filename to $extractDir"
            }
        }
    }

    tasks.whenTaskAdded { task ->
        if (task.name.contains('externalNativeBuild')) {
            task.dependsOn(extractAARForNativeBuild)
        }
    }